name: asistencia

services:
  app:
    restart: unless-stopped
    build:
      context: .
      args:
        # Se incrusta en el bundle del cliente; debe coincidir con API_KIOSCO_KEY.
        NEXT_PUBLIC_API_KIOSCO_KEY: ${API_KIOSCO_KEY:-kiosco-local-key}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://asistencia:asistencia@db:5432/asistencia
      API_KIOSCO_KEY: ${API_KIOSCO_KEY:-kiosco-local-key}
      GUARDAR_FOTO_FICHAJE: ${GUARDAR_FOTO_FICHAJE:-false}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-cambia-este-secreto}
      TZ: America/Caracas
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - asistencia-net
  db:
    restart: unless-stopped
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: asistencia
      POSTGRES_PASSWORD: asistencia
      POSTGRES_DB: asistencia
      TZ: America/Caracas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - asistencia-net
  proxy:
    restart: unless-stopped
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - asistencia-net

volumes:
  pgdata:

networks:
  asistencia-net:
